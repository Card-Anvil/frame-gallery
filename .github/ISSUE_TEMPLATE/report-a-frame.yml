name: Report a frame
description: A listed frame infringes rights, is malicious, or should be removed.
labels: ["report"]
body:
  - type: input
    id: repository
    attributes:
      label: Which repository
      placeholder: octocat/my-frames
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Please be specific. If this is a rights claim, say what you own.
    validations:
      required: true
